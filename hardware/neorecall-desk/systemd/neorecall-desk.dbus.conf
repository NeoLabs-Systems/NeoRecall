<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The appliance publishes its own GATT service and manages headphone pairing, so
  it needs to own BlueZ objects rather than merely read them. Without this, the
  app can see the device but never connect to it.
-->
<busconfig>
  <policy user="neorecall">
    <allow own_prefix="de.neorecall"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.GattManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.LEAdvertisingManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1"/>
  </policy>
</busconfig>
