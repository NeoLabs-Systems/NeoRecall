# Bluetooth audio policy.
#
# The default is playback quality. A headset microphone is available but is an
# explicit choice in the app, because switching a headset into hands-free mode
# drops playback to narrowband — that is what the Bluetooth standard does, and no
# amount of configuration here can undo it.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]

  # SBC and AAC only. `sbc_xq` is high-bitrate SBC, and on this board it is the
  # wrong trade: the Pi Zero 2 W puts Wi-Fi and Bluetooth on one chip behind one
  # antenna, and the extra bitrate is what turns an occasional retransmission
  # into a continuous stutter. Ordinary SBC has headroom to lose a packet and
  # carry on, which on a recorder's monitor path matters more than the last few
  # kilohertz.
  bluez5.codecs = [ sbc aac ]
  bluez5.enable-sbc-xq = false

  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  # Connect for playback first; the app switches the profile when the user asks
  # for the headset microphone.
  bluez5.autoswitch-profile = false
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink"
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
  {
    # Never park a Bluetooth sink. PipeWire suspends an idle node after a few
    # seconds, and on a headset that tears down the A2DP transport; rebuilding
    # it on the next sample is heard as a gap, and when the headset does not
    # come back cleanly, as silence a moment after it had been working.
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
