# This appliance has no login session, and WirePlumber has to be told so.
#
# Its Bluetooth monitor is gated behind seat monitoring: on an ordinary desktop
# that is correct, because only the person actually sitting at the machine
# should own the adapter. This device has nobody sitting at it. The audio stack
# runs under a service account kept alive by lingering, which by definition has
# no active session on a seat, so the gate never opened — and the consequence
# was not a warning anywhere but a bare refusal from BlueZ:
#
#     could not connect 28:9A:4B:7B:38:1D: br-connection-profile-unavailable
#
# The headphones were paired, in range, and willing. Nothing on the device had
# registered an A2DP or HFP endpoint for them to connect *to*, because the
# monitor that registers those endpoints had quietly stayed asleep.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    support.logind = disabled
  }
}
