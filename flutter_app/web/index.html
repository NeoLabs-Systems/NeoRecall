<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoRecall private audio memory">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0E1511">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NeoRecall</title>
  <script src="audio_capture_worklet.js"></script>

  <style>
    /* NeoRecall "Control Surface" splash — mirrors flutter_app/lib/main_theme.dart
       so the pre-Flutter paint matches the app instead of flashing white. */
    html, body {
      height: 100%;
      margin: 0;
      background: #0E1511;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #F4F1E8; }
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(120% 120% at 50% 38%, #131b16 0%, #0A0F0C 70%, #0E1511 100%);
      transition: opacity 0.5s ease;
    }
    @media (prefers-color-scheme: light) {
      #splash {
        background: radial-gradient(120% 120% at 50% 38%, #FDFCF8 0%, #EDE9DC 70%, #F4F1E8 100%);
      }
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-mark {
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
      animation: splash-breathe 2.4s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      #splash-mark { filter: drop-shadow(0 6px 16px rgba(28, 33, 23, 0.18)); }
    }
    /* The gold capture ring turns like a record; the core pulses like a
       live recording indicator. */
    #splash-mark .ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-spin 4s linear infinite;
    }
    #splash-mark .core {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    #splash-word {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #AEB7A6;
      opacity: 0.92;
    }
    @media (prefers-color-scheme: light) {
      #splash-word { color: #49503F; }
    }

    #splash-dots {
      display: flex;
      gap: 6px;
    }
    #splash-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #E1B052;
      opacity: 0.35;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      #splash-dots span { background: #B07D2B; }
    }
    #splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes splash-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes splash-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.82); opacity: 0.72; }
    }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-mark, #splash-mark .ring, #splash-mark .core, #splash-dots span {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash" role="presentation" aria-hidden="true">
    <svg id="splash-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="16" fill="#151922"/>
      <circle class="ring" cx="32" cy="32" r="14" fill="none" stroke="#E3B655"
              stroke-width="4" stroke-linecap="round" stroke-dasharray="66 22"/>
      <circle class="core" cx="32" cy="32" r="5" fill="#D98AA6"/>
      <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="15.6" fill="none"
            stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    </svg>
    <div id="splash-word">NeoRecall</div>
    <div id="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <script>
    // Fade the splash once Flutter mounts its view (or after a safety timeout),
    // so we never get stuck showing it if the mutation never fires.
    (function () {
      var splash = document.getElementById('splash');
      var hidden = false;

      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-hidden');
        setTimeout(function () { splash.remove(); }, 550);
      }

      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(hideSplash, 6000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
