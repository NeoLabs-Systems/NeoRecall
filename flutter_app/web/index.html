<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoRecall private audio memory">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0E1511">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>NeoRecall</title>
  <script src="audio_capture_worklet.js"></script>

  <style>
    /* NeoRecall "Control Surface" splash — mirrors flutter_app/lib/main_theme.dart
       so the pre-Flutter paint matches the app instead of flashing white. */
    html, body {
      height: 100%;
      margin: 0;
      background: #0E1511;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #F4F1E8; }
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(120% 120% at 50% 38%, #131b16 0%, #0A0F0C 70%, #0E1511 100%);
      transition: opacity 0.5s ease;
    }
    @media (prefers-color-scheme: light) {
      #splash {
        background: radial-gradient(120% 120% at 50% 38%, #FDFCF8 0%, #EDE9DC 70%, #F4F1E8 100%);
      }
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-mark {
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
      animation: splash-breathe 2.4s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      #splash-mark { filter: drop-shadow(0 6px 16px rgba(28, 33, 23, 0.18)); }
    }
    /* The gold capture ring turns like a record; the core pulses like a
       live recording indicator. */
    #splash-mark .ring {
      transform-box: view-box;
      transform-origin: 50px 50px;
      animation: splash-spin 4s linear infinite;
    }
    #splash-mark .core {
      transform-box: fill-box;
      transform-origin: center;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    #splash-word {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #AEB7A6;
      opacity: 0.92;
    }
    @media (prefers-color-scheme: light) {
      #splash-word { color: #49503F; }
    }

    #splash-dots {
      display: flex;
      gap: 6px;
    }
    #splash-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #E1B052;
      opacity: 0.35;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      #splash-dots span { background: #B07D2B; }
    }
    #splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes splash-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes splash-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.82); opacity: 0.72; }
    }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-mark, #splash-mark .ring, #splash-mark .core, #splash-dots span {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash" role="presentation" aria-hidden="true">
    <svg id="splash-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="splash-tile" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#705331"/>
          <stop offset="100%" stop-color="#2A5740"/>
        </linearGradient>
        <radialGradient id="splash-shine" cx="26%" cy="14%" r="72%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="splash-capsule" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fffdf6"/>
          <stop offset="52%" stop-color="#eee3cc"/>
          <stop offset="100%" stop-color="#b5a888"/>
        </linearGradient>
        <radialGradient id="splash-node" cx="36%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#f8dca8"/>
          <stop offset="52%" stop-color="#d3a85f"/>
          <stop offset="100%" stop-color="#9b6f2f"/>
        </radialGradient>
        <linearGradient id="splash-tube" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fffaf0"/>
          <stop offset="52%" stop-color="#efe7d6"/>
          <stop offset="100%" stop-color="#cabf9f"/>
        </linearGradient>
        <clipPath id="splash-tc"><rect width="100" height="100" rx="22.5"/></clipPath>
      </defs>
      <g clip-path="url(#splash-tc)">
        <rect width="100" height="100" fill="url(#splash-tile)"/>
        <rect width="100" height="100" fill="url(#splash-shine)"/>
        <path class="ring" d="M 67.78 24.61 A 31 31 0 1 1 32.22 24.61" fill="none"
              stroke="url(#splash-tube)" stroke-width="5.6" stroke-linecap="round"
              stroke-opacity="0.9"/>
        <rect x="41" y="29" width="18" height="32" rx="9" fill="url(#splash-capsule)"/>
        <path d="M 34.5 51 A 15.5 15.5 0 0 0 65.5 51" fill="none"
              stroke="url(#splash-tube)" stroke-width="5.2" stroke-linecap="round"/>
        <circle class="core" cx="50" cy="19" r="6.2" fill="url(#splash-node)"/>
        <circle class="core" cx="47.768" cy="17.14" r="1.86" fill="#fff7e6" fill-opacity="0.8"/>
      </g>
      <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="22" fill="none"
            stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
    </svg>
    <div id="splash-word">NeoRecall</div>
    <div id="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <script>
    // Fade the splash once Flutter mounts its view (or after a safety timeout),
    // so we never get stuck showing it if the mutation never fires.
    (function () {
      var splash = document.getElementById('splash');
      var hidden = false;

      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-hidden');
        setTimeout(function () { splash.remove(); }, 550);
      }

      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(hideSplash, 6000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
