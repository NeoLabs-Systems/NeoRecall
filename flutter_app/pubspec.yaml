name: neorecall
description: Private, offline-first audio memory for NeoRecall.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.7.1
  connectivity_plus: 7.0.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  desktop_audio_capture:
    path: third_party/desktop_audio_capture
  file_picker: ^10.3.3
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.1.0
  http: ^1.5.0
  idb_shim: ^2.6.7
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  sqflite_common_ffi: ^2.3.6
  tray_manager: ^0.5.1
  uuid: ^4.5.1
  window_manager: ^0.5.1
  launch_at_startup: ^0.5.1
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  permission_handler: ^12.0.0+1
  universal_ble: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.svg
    - assets/branding/logo.png
    - assets/branding/tray_idle.png
    - assets/branding/tray_idle.ico
    - assets/branding/tray_recording.png
    - assets/branding/tray_recording.ico
