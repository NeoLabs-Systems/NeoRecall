# Lint policy for the NeoRecall client.
#
# `flutter_lints` is the baseline. The rules added below are the ones that catch
# mistakes this app actually makes: it records audio for hours in the
# background, so a future nobody waits on, a slow filesystem round trip, or a
# `throw` inside a `finally` costs a recording rather than a frame.
#
# Rules deliberately NOT enabled:
#   cancel_subscriptions / close_sinks — every instance they flag here is
#     already cancelled through a helper or a local the rule cannot follow, so
#     turning them on means six standing false positives and an `ignore:`
#     comment habit that hides the real ones.
#   directives_ordering — 110 findings, none of them a defect.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - avoid_slow_async_io
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
