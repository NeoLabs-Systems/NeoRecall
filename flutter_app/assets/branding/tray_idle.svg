<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="NeoRecall">
  <defs>
    <linearGradient id="nrt-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#705331"/>
      <stop offset="100%" stop-color="#2A5740"/>
    </linearGradient>
    <radialGradient id="nrt-shine" cx="26%" cy="14%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nrt-capsule" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="52%" stop-color="#eee3cc"/>
