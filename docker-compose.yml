services:
  neorecall:
    build: .
    image: neorecall:local
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      ANALYTICS_ENABLED:
      NEORECALL_HOST: 0.0.0.0
      NEORECALL_PORT: 4500
      NEORECALL_REQUIRE_VECTOR: "true"
      NEORECALL_ADMIN_USERS: ${NEORECALL_ADMIN_USERS:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-16384}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_MODEL: ${AI_API_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai-compatible}
      TRANSCRIPTION_API_BASE_URL: ${TRANSCRIPTION_API_BASE_URL:-}
      TRANSCRIPTION_API_MODEL: ${TRANSCRIPTION_API_MODEL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_API_LANGUAGE: ${TRANSCRIPTION_API_LANGUAGE:-}
      TRANSCRIPTION_API_RESPONSE_FORMAT: ${TRANSCRIPTION_API_RESPONSE_FORMAT:-verbose_json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
    volumes:
      - neorecall-data:/data
    healthcheck:
      test: ["CMD", "neorecall", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  neorecall-data:
