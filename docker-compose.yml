services:
  neorecall:
    build: .
    image: neorecall:local
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      NEORECALL_HOST: 0.0.0.0
      NEORECALL_PORT: 4500
      NEORECALL_REQUIRE_VECTOR: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-16384}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_MODEL: ${AI_API_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai-compatible}
      TRANSCRIPTION_API_BASE_URL: ${TRANSCRIPTION_API_BASE_URL:-}
      TRANSCRIPTION_API_MODEL: ${TRANSCRIPTION_API_MODEL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_API_LANGUAGE: ${TRANSCRIPTION_API_LANGUAGE:-}
      TRANSCRIPTION_API_RESPONSE_FORMAT: ${TRANSCRIPTION_API_RESPONSE_FORMAT:-verbose_json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
    volumes:
      - neorecall-data:/root/.neorecall
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  neorecall-data:
