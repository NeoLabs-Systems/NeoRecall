services:
  neorecall:
    build: .
    image: neorecall:local
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      NEORECALL_HOST: 0.0.0.0
      NEORECALL_PORT: 4500
      NEORECALL_REQUIRE_VECTOR: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # The language model runs inside the container by default and needs no
      # key. Set AI_PROVIDER=openai_compatible with AI_API_BASE_URL and
      # AI_API_MODEL to send generation to an endpoint you run instead.
      AI_PROVIDER: ${AI_PROVIDER:-llama}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-16384}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_MODEL: ${AI_API_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - neorecall-data:/root/.neorecall
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  neorecall-data:
