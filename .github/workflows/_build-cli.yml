name: Reusable CLI & Web Bundle Builds

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build CLI binaries from
        required: true
        type: string
      release_tag:
        description: Release tag used to name web bundle artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI binaries and web runtime bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build static CLI binaries
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -X github.com/NeoLabs-Systems/neorecall/internal/config.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o dist/neorecall-cli-linux-x64 ./cmd/neorecall
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/neorecall-cli-linux-arm64 ./cmd/neorecall
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/neorecall-cli-macos-x64 ./cmd/neorecall
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/neorecall-cli-macos-arm64 ./cmd/neorecall
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/neorecall-cli-windows-x64.exe ./cmd/neorecall

          tar -czf "dist/neorecall-web-${VERSION}.tar.gz" \
            flutter_app/build/web \
            landing \
            test/fixtures/de_en_two_speakers.wav
          ls -lh dist

      - name: Upload CLI and web bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-cli-bundle
          path: dist/*
          if-no-files-found: error
