name: Reusable CLI & Web Bundle Builds

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build CLI binaries from
        required: true
        type: string
      release_tag:
        description: Release tag used to name web bundle artifact
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI binaries and web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build static CLI binaries and web bundle
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${RELEASE_TAG#v}"
          LDFLAGS="-s -w -X github.com/NeoLabs-Systems/neorecall/internal/config.Version=${VERSION}"

          for target in \
            linux/amd64:neorecall-cli-linux-x64 \
            linux/arm64:neorecall-cli-linux-arm64 \
            darwin/amd64:neorecall-cli-macos-x64 \
            darwin/arm64:neorecall-cli-macos-arm64 \
            windows/amd64:neorecall-cli-windows-x64.exe
          do
            os_arch="${target%%:*}"
            out_name="${target##*:}"
            GOOS="${os_arch%/*}" GOARCH="${os_arch#*/}" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${out_name}" ./cmd/neorecall
          done

          tar -czf "dist/neorecall-web-${VERSION}.tar.gz" \
            flutter_app/build/web \
            landing \
            test/fixtures/de_en_two_speakers.wav
          ls -lh dist

      - name: Upload CLI and web bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-cli-bundle
          path: dist/*
          if-no-files-found: error

      - name: Attach CLI and web bundle to release
        if: inputs.release_tag != ''
        uses: ./.github/actions/attach-release-assets
        with:
          release_tag: ${{ inputs.release_tag }}
          files: |
            dist/neorecall-cli-*
            dist/neorecall-web-*.tar.gz
