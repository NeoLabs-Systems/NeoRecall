name: Build Site

on:
  push:
    branches: [beta]
    paths: [docs/**, landing/**, README.md, .github/workflows/build-site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - run: |
          mkdir -p _site/docs
          cp -R landing/. _site/
          cp -R docs/build/. _site/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: neorecall-site
          path: _site
          if-no-files-found: error
