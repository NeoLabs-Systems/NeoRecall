name: Reusable App Builds

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build apps from
        required: true
        type: string
      release_tag:
        description: Release tag used to name artifacts
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Flutter
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Enable macOS desktop (CocoaPods mode)
        run: flutter config --enable-macos-desktop --no-enable-swift-package-manager

      - name: Ensure macOS project exists
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Build macOS release
        run: flutter build macos --release --no-pub

      - name: Verify macOS Opus runtime
        run: test -n "$(find build/macos/Build/Products/Release -path '*.app/Contents/Frameworks/opus.framework' -print -quit)"

      - name: Package macOS app
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="commit-${GITHUB_SHA:0:12}"
          fi
          APP_PATH="build/macos/Build/Products/Release/NeoRecall.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -n 1)"
          fi
          if [ -z "${APP_PATH:-}" ] || [ ! -d "$APP_PATH" ]; then
            echo "NeoRecall.app was not produced."
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          mkdir -p ../dist
          DMG_ROOT="$(mktemp -d)"
          trap 'rm -rf "$DMG_ROOT"' EXIT
          ditto "$APP_PATH" "$DMG_ROOT/$(basename "$APP_PATH")"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "NeoRecall" \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            -ov \
            "../dist/NeoRecall-macOS-${VERSION}.dmg"
          ls -la ../dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-macos-app
          path: dist/NeoRecall-macOS-*.dmg
          if-no-files-found: error

      - name: Attach macOS app to release
        if: inputs.release_tag != ''
        uses: ./.github/actions/attach-release-assets
        with:
          release_tag: ${{ inputs.release_tag }}
          files: dist/NeoRecall-macOS-*.dmg

  build-windows:
    name: Build Windows app
    runs-on: windows-2022
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Flutter
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows project exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --no-pub

      - name: Verify Windows Opus runtime
        shell: pwsh
        run: |
          $opus = Get-ChildItem build\windows -Recurse -File -Filter "libopus_x64.dll.blob" |
            Select-Object -First 1
          if (-not $opus) { throw "Bundled Opus DLL asset is missing." }

      - name: Package Windows app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v", "V")
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "commit-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          $releaseDir = Join-Path $PWD "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $candidate = Get-ChildItem "build\windows" -Directory -Recurse -Filter "Release" |
              Where-Object { Test-Path (Join-Path $_.FullName "*.exe") } |
              Select-Object -First 1
            if (-not $candidate) { throw "Windows Release directory was not produced." }
            $releaseDir = $candidate.FullName
          }
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          $out = Join-Path $distDir "NeoRecall-Windows-x64-$version.zip"
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath $out -Force
          Get-ChildItem $distDir

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-windows-app
          path: dist/NeoRecall-Windows-x64-*.zip
          if-no-files-found: error

      - name: Attach Windows app to release
        if: inputs.release_tag != ''
        uses: ./.github/actions/attach-release-assets
        with:
          release_tag: ${{ inputs.release_tag }}
          files: dist/NeoRecall-Windows-x64-*.zip

  build-android:
    name: Build Android & Wear OS APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Build Android & Wear OS APKs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="commit-${GITHUB_SHA:0:12}"
          fi
          mkdir -p ../dist
          flutter build apk --release --no-pub
          unzip -l build/app/outputs/flutter-apk/app-release.apk |
            grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libopus\.so'
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/NeoRecall-Android-${VERSION}.apk"

          (cd android && ./gradlew :wear:assembleRelease)
          cp build/wear/outputs/apk/release/wear-release.apk \
            "../dist/NeoRecall-WearOS-${VERSION}.apk"
          ls -la ../dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-android-app
          path: |
            dist/NeoRecall-Android-*.apk
            dist/NeoRecall-WearOS-*.apk
          if-no-files-found: error

      - name: Attach Android & Wear OS APKs to release
        if: inputs.release_tag != ''
        uses: ./.github/actions/attach-release-assets
        with:
          release_tag: ${{ inputs.release_tag }}
          files: |
            dist/NeoRecall-Android-*.apk
            dist/NeoRecall-WearOS-*.apk
