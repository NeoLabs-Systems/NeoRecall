name: Release Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Prepare stable release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.stable_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare beta promotion
        id: promotion_source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main beta --tags --force
          git checkout main
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git merge --no-ff origin/beta -m "chore(release): promote beta to main [skip ci]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Resolve next stable version
        id: stable_version
        run: node scripts/next_release_version.js stable

      - name: Set package version
        run: npm version "${{ steps.stable_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Backend tests
        run: npm run test:backend

      - name: Flutter checks
        working-directory: flutter_app
        run: flutter analyze --no-pub && flutter test --no-pub

      - name: Build bundled web client
        run: npm run build:web

      - name: Commit and tag stable release
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.stable_version.outputs.release_tag }} [skip ci]"
          git tag "${{ steps.stable_version.outputs.release_tag }}" -m "Release ${{ steps.stable_version.outputs.release_tag }}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push stable release atomically
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(
            git ls-remote origin refs/heads/main |
              awk '{print $1}'
          )"
          if [[ "$remote_sha" != "${{ steps.promotion_source.outputs.main_sha }}" ]]; then
            echo "::error::main advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push \
            --atomic \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/${{ steps.stable_version.outputs.release_tag }}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.stable_version.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "${{ steps.capture_release_sha.outputs.release_sha }}" \
            --title "Release ${{ steps.stable_version.outputs.release_tag }}" \
            --generate-notes \
            --draft \
            --latest=false

  build-apps:
    name: Build app binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-package:
    name: Publish stable package
    needs: release
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout release
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Set up Node.js
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Flutter
        if: env.NODE_AUTH_TOKEN != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Install dependencies
        if: env.NODE_AUTH_TOKEN != ''
        run: npm ci

      - name: Install Flutter dependencies
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: flutter_app
        run: flutter pub get

      - name: Publish package
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --tag latest

  publish-app-assets:
    name: Complete GitHub release
    needs:
      - release
      - build-apps
      - publish-package
    uses: ./.github/workflows/_publish-app-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: false

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-app-assets
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
