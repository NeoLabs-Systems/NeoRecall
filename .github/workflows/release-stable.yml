name: Release Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Promote beta and publish stable release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.stable_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Set up Flutter
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8
        with:
          pub-get: 'false'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote beta into main
        id: promotion_source
        run: |
          set -euo pipefail
          git fetch origin main beta --tags --force
          git checkout main
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          if git merge --no-ff origin/beta -m "chore(release): promote beta to main [skip ci]"; then
            exit 0
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflicts" ]]; then
            echo "::error::The promotion merge failed without leaving conflicts to resolve."
            exit 1
          fi
          unexpected="$(printf '%s\n' "$conflicts" | grep -vxE 'internal/config/config\.go|package\.json|flutter_app/build/web/.*' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::beta and main conflict outside release bookkeeping files; resolve this by hand."
            printf '%s\n' "$unexpected" >&2
            git merge --abort
            exit 1
          fi
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            git checkout origin/beta -- "$path"
            git add "$path"
          done <<< "$conflicts"
          git commit --no-edit

      - name: Resolve and set stable version
        id: stable_version
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go run ./cmd/neorecall-release resolve-version --channel stable --github-output
          version="$(go run ./cmd/neorecall-release resolve-version --channel stable)"
          go run ./cmd/neorecall-release set-version "$version"
          echo "NEW_VERSION=v${version}" >> "$GITHUB_ENV"

      - name: Run Go checks
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Run Flutter checks
        working-directory: flutter_app
        run: flutter pub get && flutter analyze --no-pub && flutter test --no-pub

      - name: Build bundled web client
        uses: ./.github/actions/build-web

      - name: Commit, tag, and push stable release atomically
        run: |
          set -euo pipefail
          git add internal/config/config.go package.json
          git add -f flutter_app/build/web
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          git tag "$NEW_VERSION" -m "Release ${NEW_VERSION}"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${{ steps.promotion_source.outputs.main_sha }}" ]]; then
            echo "::error::main advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${NEW_VERSION}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.capture_release_sha.outputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $NEW_VERSION already exists; reusing it."
              exit 0
            fi
            if gh release create "$NEW_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Release $NEW_VERSION" \
              --generate-notes \
              --draft \
              --latest=false; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Add download links to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: 'off'
        run: go run ./cmd/neorecall-release release-download --tag "$NEW_VERSION"

  build-cli:
    name: Build CLI & web bundle
    needs: release
    uses: ./.github/workflows/_build-cli.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  build-apps:
    name: Build App Binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker Image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-release-assets:
    name: Publish Release Assets
    if: always() && needs.release.result == 'success'
    needs:
      - release
      - build-cli
      - build-apps
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: false
    secrets: inherit

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-release-assets
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
