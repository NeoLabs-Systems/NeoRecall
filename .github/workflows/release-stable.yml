name: Release Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Prepare stable release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.stable_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare beta promotion
        id: promotion_source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main beta --tags --force
          git checkout main
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          if git merge --no-ff origin/beta -m "chore(release): promote beta to main [skip ci]"; then
            exit 0
          fi
          # Both branches carry their own release commits, so the version fields
          # of these two files conflict on every promotion. beta's copies are the
          # right ones: main holds nothing of its own here, and "Set package
          # version" below overwrites the version moments later anyway. The
          # lockfile is only ever taken wholesale from a branch -- regenerating
          # it drops the platform binaries the other jobs install.
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflicts" ]]; then
            echo "::error::The promotion merge failed without leaving conflicts to resolve."
            exit 1
          fi
          unexpected="$(printf '%s\n' "$conflicts" | grep -vxE 'package\.json|package-lock\.json' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::beta and main conflict outside the version files; resolve this by hand."
            printf '%s\n' "$unexpected" >&2
            git merge --abort
            exit 1
          fi
          git checkout origin/beta -- package.json package-lock.json
          git add package.json package-lock.json
          git commit --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Resolve next stable version
        id: stable_version
        run: node scripts/next_release_version.js stable

      - name: Set package version
        run: npm version "${{ steps.stable_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Backend tests
        run: npm run test:backend

      - name: Flutter checks
        working-directory: flutter_app
        run: flutter analyze --no-pub && flutter test --no-pub

      # The Git installer clones this branch and runs it directly, so the
      # release commit has to carry a web client built from that same commit.
      - name: Build bundled web client
        run: npm run build:web

      - name: Commit and tag stable release
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json flutter_app/build/web
          git commit -m "chore(release): ${{ steps.stable_version.outputs.release_tag }} [skip ci]"
          git tag "${{ steps.stable_version.outputs.release_tag }}" -m "Release ${{ steps.stable_version.outputs.release_tag }}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push stable release atomically
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(
            git ls-remote origin refs/heads/main |
              awk '{print $1}'
          )"
          if [[ "$remote_sha" != "${{ steps.promotion_source.outputs.main_sha }}" ]]; then
            echo "::error::main advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push \
            --atomic \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/${{ steps.stable_version.outputs.release_tag }}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stable_version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.capture_release_sha.outputs.release_sha }}
        run: |
          set -euo pipefail
          # The release tag was already pushed. A transient `gh release
          # create` failure here must not permanently burn this version
          # number, so retry with backoff and treat an already-existing
          # release (e.g. from a prior attempt of this same step, or a
          # workflow re-run) as success instead of erroring out.
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; reusing it."
              exit 0
            fi
            if gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Release $RELEASE_TAG" \
              --generate-notes \
              --draft \
              --latest=false; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to create GitHub release $RELEASE_TAG after 5 attempts."
          exit 1

  build-apps:
    name: Build app binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-app-assets:
    name: Complete GitHub release
    # Only the release job (tag + draft release) is required. build-apps is
    # intentionally not checked: it fans out into independent per-platform
    # jobs, and _publish-app-assets.yml already tolerates partial platform
    # failures, only hard-failing if zero assets came through.
    if: >-
      always() &&
      needs.release.result == 'success'
    needs:
      - release
      - build-apps
    uses: ./.github/workflows/_publish-app-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: false

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-app-assets
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
