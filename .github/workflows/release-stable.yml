name: Release Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Promote beta and publish stable release
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.stable_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote beta to main
        run: |
          git fetch origin main beta --tags --force
          git checkout main
          git merge --no-ff origin/beta -m "chore(release): promote beta to main [skip ci]"
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Resolve next stable version
        id: stable_version
        run: node scripts/next_release_version.js stable

      - name: Set package version
        run: npm version "${{ steps.stable_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Backend tests
        run: npm run test:backend

      - name: Flutter checks
        working-directory: flutter_app
        run: flutter analyze --no-pub && flutter test --no-pub

      - name: Build bundled web client
        run: npm run build:web

      - name: Commit and tag stable release
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.stable_version.outputs.release_tag }} [skip ci]" || true
          git tag "${{ steps.stable_version.outputs.release_tag }}" -m "Release ${{ steps.stable_version.outputs.release_tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.stable_version.outputs.release_tag }}"

      - name: Publish stable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --tag latest

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.stable_version.outputs.release_tag }}" \
            --title "Release ${{ steps.stable_version.outputs.release_tag }}" \
            --generate-notes \
            --latest

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-apps:
    name: Build app binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-app-assets:
    name: Publish app binaries
    needs:
      - release
      - build-apps
    uses: ./.github/workflows/_publish-app-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-app-assets
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
