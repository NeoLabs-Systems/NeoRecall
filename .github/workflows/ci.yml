name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...

      - name: Test
        env:
          GOWORK: 'off'
        run: go test -race -count=1 ./...

      - name: Static build
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/neorecall
          done

  flutter-test:
    name: Flutter analyze, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Build web client
        working-directory: flutter_app
        run: flutter build web --release --no-pub --base-href /app/
      - name: Verify web Opus runtime
        working-directory: flutter_app
        run: |
          test -s build/web/assets/packages/opus_codec_web/assets/libopus.js
          test -s build/web/assets/packages/opus_codec_web/assets/libopus.wasm

  desktop-compile:
    name: ${{ matrix.platform }} compile gate
    # macOS and Windows runners bill at 10x and 2x, so these two stay on pull
    # requests. The Android gate below runs on every push instead, because it
    # is an ordinary Linux runner and native code that does not compile is
    # exactly what a push to a release branch must not carry.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            command: flutter build macos --release --no-pub
            verify: test -n "$(find build/macos/Build/Products/Release -path '*.app/Contents/Frameworks/opus.framework' -print -quit)"
          - platform: Windows
            runner: windows-2022
            command: flutter build windows --release --no-pub
            verify: if (-not (Get-ChildItem build/windows -Recurse -File -Filter 'libopus_x64.dll.blob' | Select-Object -First 1)) { throw 'Bundled Opus DLL asset is missing.' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Compile desktop client
        working-directory: flutter_app
        run: ${{ matrix.command }}
      - name: Verify desktop Opus runtime
        working-directory: flutter_app
        run: ${{ matrix.verify }}

  android-compile:
    name: Android compile gate
    # Runs on pushes as well. Work on this project lands straight on main and
    # beta rather than through pull requests, so a gate that only runs on a
    # pull request does not run at all: a Kotlin file that did not compile
    # reached the branch and was found by building it locally, not here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Compile Android APK
        working-directory: flutter_app
        run: flutter build apk --release --no-pub
      - name: Verify Android Opus runtime
        working-directory: flutter_app
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libopus\.so'

  docs:
    name: Docs build
    if: github.event_name != 'push' || github.ref != 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
