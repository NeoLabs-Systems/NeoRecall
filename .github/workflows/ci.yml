name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run backend tests
        run: npm run test:backend

  flutter-test:
    name: Flutter analyze, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Build web client
        working-directory: flutter_app
        run: flutter build web --release --no-pub --base-href /app/

  desktop-compile:
    name: ${{ matrix.platform }} compile gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            command: flutter build macos --release --no-pub
          - platform: Windows
            runner: windows-2025
            command: flutter build windows --release --no-pub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Compile desktop client
        working-directory: flutter_app
        run: ${{ matrix.command }}

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
