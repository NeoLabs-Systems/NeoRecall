name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
  workflow_call:
    inputs:
      compile_gates:
        description: Run heavy desktop/Android compile gates in CI
        required: false
        type: boolean
        default: true
      upload_web:
        description: Upload built web bundle for downstream release job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...

      - name: Vulnerability check
        env:
          GOWORK: 'off'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Test
        env:
          GOWORK: 'off'
        run: go test -race -count=1 ./...

      - name: Static build
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/neorecall
          done
          go build -o /dev/null ./cmd/neorecall-release

  flutter-test:
    name: Flutter tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub

      - name: Build web client
        uses: ./.github/actions/build-web

      - name: Upload CI web bundle
        if: ${{ inputs.upload_web == true }}
        uses: actions/upload-artifact@v4
        with:
          name: neorecall-ci-web-bundle
          path: flutter_app/build/web
          retention-days: 1
          if-no-files-found: error

  desktop-compile:
    name: ${{ matrix.platform }} compile gate
    # macOS and Windows runners carry a higher billing multiplier, so desktop
    # compile gates run on pull requests unless explicitly disabled.
    if: ${{ github.event_name == 'pull_request' && inputs.compile_gates != false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            command: flutter config --no-enable-swift-package-manager && flutter build macos --release --no-pub
            verify: test -n "$(find build/macos/Build/Products/Release -path '*.app/Contents/Frameworks/opus.framework' -print -quit)"
          - platform: Windows
            runner: windows-2022
            command: flutter build windows --release --no-pub
            verify: if (-not (Get-ChildItem build/windows -Recurse -File -Filter 'libopus_x64.dll.blob' | Select-Object -First 1)) { throw 'Bundled Opus DLL asset is missing.' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Compile desktop client
        working-directory: flutter_app
        run: ${{ matrix.command }}

      - name: Verify desktop Opus runtime
        working-directory: flutter_app
        run: ${{ matrix.verify }}

  android-compile:
    name: Android compile gate
    # Release workflows pass compile_gates=false because build-apps immediately
    # compiles and packages both Android and Wear OS APKs.
    if: ${{ github.event_name != 'push' && inputs.compile_gates != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Compile Android APK
        working-directory: flutter_app
        run: flutter build apk --release --no-pub

      - name: Verify Android Opus runtime
        working-directory: flutter_app
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libopus\.so'

  docs:
    name: Docs build
    if: github.event_name != 'push' || github.ref != 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build
