name: Reusable App Asset Publisher

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive app assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-app-assets:
    name: Attach apps to release
    runs-on: ubuntu-latest
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: neorecall-*-app
          merge-multiple: true

      - name: Verify app assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          macos=(dist/NeoRecall-macOS-*.dmg)
          windows=(dist/NeoRecall-Windows-x64-*.zip)
          android=(dist/NeoRecall-Android-*.apk)
          asset_count=$((${#macos[@]} + ${#windows[@]} + ${#android[@]}))
          if [ "$asset_count" -eq 0 ]; then
            echo "No successful app build produced a release asset."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          echo "Publishing $asset_count successful app asset(s)."
          find dist -maxdepth 1 -type f -print

      - name: Upload apps to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            dist/NeoRecall-macOS-*.dmg
            dist/NeoRecall-Windows-x64-*.zip
            dist/NeoRecall-Android-*.apk
          )

          gh release upload \
            "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          declare -A uploaded_by_name=()
          while IFS= read -r name; do
            uploaded_by_name["$name"]=1
          done < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '.assets[].name'
          )

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if [[ -z "${uploaded_by_name[$name]:-}" ]]; then
              echo "::error::Release asset was not attached: $name"
              exit 1
            fi
          done

          echo "Verified ${#assets[@]} asset(s) on release $RELEASE_TAG."
