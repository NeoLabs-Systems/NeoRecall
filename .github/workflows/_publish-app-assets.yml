name: Reusable App Asset Publisher

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive app assets
        required: true
        type: string
      release_sha:
        description: Commit SHA the release tag must resolve to
        required: true
        type: string
      prerelease:
        description: Whether to publish the draft as a prerelease
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  publish-app-assets:
    name: Attach apps to release
    runs-on: ubuntu-latest
    steps:
      - name: Verify draft release target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_json="$(
            gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,isDraft,isPrerelease,tagName
          )"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG must remain a draft until all assets are attached."
            exit 1
          fi

          tag_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
              --jq '.sha'
          )"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag $RELEASE_TAG resolves to $tag_sha, expected $RELEASE_SHA."
            exit 1
          fi

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: neorecall-*-app
          merge-multiple: true

      - name: Verify app assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_assets=(
            "dist/NeoRecall-macOS-${version}.dmg"
            "dist/NeoRecall-Windows-x64-${version}.zip"
            "dist/NeoRecall-Android-${version}.apk"
          )
          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Expected release asset is missing: $asset"
              find dist -maxdepth 1 -type f -print
              exit 1
            fi
          done

          asset_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -ne "${#expected_assets[@]}" ]]; then
            echo "::error::Unexpected files were downloaded with the release assets."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          echo "Publishing ${#expected_assets[@]} release asset(s)."
          find dist -maxdepth 1 -type f -print

      - name: Upload apps to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "dist/NeoRecall-macOS-${version}.dmg"
            "dist/NeoRecall-Windows-x64-${version}.zip"
            "dist/NeoRecall-Android-${version}.apk"
          )

          gh release upload \
            "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          uploaded_assets="$(
            gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets
          )"

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if ! jq \
              --exit-status \
              --arg name "$name" \
              '.assets | map(.name) | index($name) != null' \
              <<<"$uploaded_assets" \
              >/dev/null; then
              echo "::error::Release asset was not attached: $name"
              exit 1
            fi
          done

          echo "Verified ${#assets[@]} asset(s) on release $RELEASE_TAG."

      - name: Publish completed GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          publish_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft=false
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_args+=(--prerelease)
          else
            publish_args+=(--latest)
          fi
          gh release edit "${publish_args[@]}"

          release_json="$(
            gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName
          )"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft."
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<<"$release_json")" != "$IS_PRERELEASE" ]]; then
            echo "::error::Release $RELEASE_TAG has the wrong release channel."
            exit 1
          fi
