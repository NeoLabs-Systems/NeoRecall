name: Release Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

jobs:
  ci:
    name: CI
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      compile_gates: false
      upload_web: true

  release:
    name: Publish beta release
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.beta_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify release source
        id: release_source
        run: |
          set -euo pipefail
          git fetch origin beta --tags --force
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/beta)"
          if [[ "$source_sha" != "$remote_sha" ]]; then
            echo "::error::Refusing to release stale commit $source_sha; beta is now $remote_sha."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve and set beta version
        id: beta_version
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go run ./cmd/neorecall-release resolve-version --channel beta --github-output
          source_tag="v$(go run ./cmd/neorecall-release version)"
          version="$(go run ./cmd/neorecall-release resolve-version --channel beta)"
          go run ./cmd/neorecall-release set-version "$version"
          echo "NEW_VERSION=v${version}" >> "$GITHUB_ENV"

      # Reuse the tested web bundle from CI to skip a duplicate Flutter build.
      - name: Clean existing web bundle directory
        run: rm -rf flutter_app/build/web && mkdir -p flutter_app/build/web

      - name: Download bundled web client from CI
        id: dl_web
        uses: actions/download-artifact@v4
        with:
          name: neorecall-ci-web-bundle
          path: flutter_app/build/web
        continue-on-error: true

      - name: Fallback web client build
        if: steps.dl_web.outcome != 'success'
        uses: ./.github/actions/setup-flutter

      - name: Fallback compile web client
        if: steps.dl_web.outcome != 'success'
        uses: ./.github/actions/build-web

      - name: Commit and push beta release
        run: |
          set -euo pipefail
          git add internal/config/config.go
          git add -f flutter_app/build/web
          git commit -m "chore(beta-release): ${NEW_VERSION} [skip ci]"
          git tag "$NEW_VERSION" -m "chore(beta-release): ${NEW_VERSION}"
          remote_sha="$(git ls-remote origin refs/heads/beta | awk '{print $1}')"
          if [[ "$remote_sha" != "${{ steps.release_source.outputs.source_sha }}" ]]; then
            echo "::error::beta advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push --atomic origin HEAD:refs/heads/beta "refs/tags/${NEW_VERSION}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.capture_release_sha.outputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub prerelease $NEW_VERSION already exists."
              exit 0
            fi
            if gh release create "$NEW_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Beta $NEW_VERSION" \
              --generate-notes \
              --draft \
              --prerelease \
              --latest=false; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Add download links to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: 'off'
        run: go run ./cmd/neorecall-release release-download --tag "$NEW_VERSION"

  build-cli:
    name: Build CLI & web bundle
    needs: release
    uses: ./.github/workflows/_build-cli.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  build-apps:
    name: Build App Binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker Image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-release-assets:
    name: Publish Release Assets
    if: always() && needs.release.result == 'success'
    needs:
      - release
      - build-cli
      - build-apps
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: true
    secrets: inherit

  notify-discord:
    name: Notify Discord
    if: always() && needs.release.result == 'success' && needs.publish-release-assets.result == 'success' && needs.release.outputs.release_tag != ''
    needs:
      - release
      - publish-release-assets
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
