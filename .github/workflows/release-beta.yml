name: Release Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

jobs:
  ci:
    name: CI
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml

  release:
    name: Prepare beta release
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.beta_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: beta

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify release source
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta --tags --force
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/beta)"
          if [[ "$source_sha" != "$remote_sha" ]]; then
            echo "::error::Refusing to release stale commit $source_sha; beta is now $remote_sha."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve next beta version
        id: beta_version
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(sed -nE 's/.*Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/config/config.go | head -n 1)"
          file_base="${file_version%%-*}"
          latest_stable="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)"
          latest_stable="${latest_stable:-0.0.0}"
          IFS=. read -r major minor patch <<< "$latest_stable"
          stable_next="${major}.${minor}.$((patch + 1))"
          base="$(printf '%s\n%s\n' "${file_base:-0.1.0}" "$stable_next" | sort -V | tail -n 1)"
          last_beta="$(git tag --list "v${base}-beta.*" | sed -nE "s/^v${base//./\\.}-beta\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"
          next=$(( ${last_beta:--1} + 1 ))
          version="${base}-beta.${next}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Set Go version constant
        shell: bash
        run: |
          sed -i -E 's/(Version[[:space:]]*=[[:space:]]*)"[^"]+"/\1"${{ steps.beta_version.outputs.version }}"/' internal/config/config.go

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      # The Git installer clones this branch and runs it directly, so the
      # release commit has to carry a web client built from that same commit.
      - name: Build bundled web client
        working-directory: flutter_app
        run: flutter build web --release --no-pub --base-href /app/

      - name: Commit and tag beta release
        shell: bash
        run: |
          set -euo pipefail
          git add internal/config/config.go
          git add -f flutter_app/build/web
          git commit -m "chore(beta-release): v${{ steps.beta_version.outputs.version }} [skip ci]"
          git tag "${{ steps.beta_version.outputs.release_tag }}" -m "chore(beta-release): v${{ steps.beta_version.outputs.version }}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push beta release commit and tag
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(
            git ls-remote origin refs/heads/beta |
              awk '{print $1}'
          )"
          if [[ "$remote_sha" != "${{ steps.release_source.outputs.source_sha }}" ]]; then
            echo "::error::beta advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push \
            --atomic \
            origin \
            HEAD:refs/heads/beta \
            "refs/tags/${{ steps.beta_version.outputs.release_tag }}"

      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.beta_version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.capture_release_sha.outputs.release_sha }}
        run: |
          set -euo pipefail
          # The release tag was already pushed. A transient `gh release
          # create` failure here must not permanently burn this version
          # number, so retry with backoff and treat an already-existing
          # release (e.g. from a prior attempt of this same step, or a
          # workflow re-run) as success instead of erroring out.
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; reusing it."
              exit 0
            fi
            if gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Beta $RELEASE_TAG" \
              --generate-notes \
              --draft \
              --prerelease \
              --latest=false; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to create GitHub release $RELEASE_TAG after 5 attempts."
          exit 1

  build-cli:
    name: Build CLI & web bundle
    needs: release
    uses: ./.github/workflows/_build-cli.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  build-apps:
    name: Build app binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-app-assets:
    name: Complete GitHub prerelease
    # Only the release job (tag + draft release) is required. build-apps is
    # intentionally not checked: it fans out into independent per-platform
    # jobs, and _publish-app-assets.yml already tolerates partial platform
    # failures, only hard-failing if zero assets came through.
    if: >-
      always() &&
      needs.release.result == 'success'
    needs:
      - release
      - build-cli
      - build-apps
    uses: ./.github/workflows/_publish-app-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: true

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-app-assets
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
