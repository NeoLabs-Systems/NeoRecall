name: Release Beta

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  release:
    name: Prepare beta release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.beta_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || 'beta' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify release source
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta --tags --force
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/beta)"
          if [[ "$source_sha" != "$remote_sha" ]]; then
            echo "::error::Refusing to release stale commit $source_sha; beta is now $remote_sha."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve next beta version
        id: beta_version
        run: node scripts/next_release_version.js beta

      - name: Set package version
        run: npm version "${{ steps.beta_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit and tag beta release
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git commit -m "chore(beta-release): v${{ steps.beta_version.outputs.version }} [skip ci]"
          git tag "${{ steps.beta_version.outputs.release_tag }}" -m "chore(beta-release): v${{ steps.beta_version.outputs.version }}"

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push beta release commit and tag
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(
            git ls-remote origin refs/heads/beta |
              awk '{print $1}'
          )"
          if [[ "$remote_sha" != "${{ steps.release_source.outputs.source_sha }}" ]]; then
            echo "::error::beta advanced to $remote_sha while this release was being prepared."
            exit 1
          fi
          git push \
            --atomic \
            origin \
            HEAD:refs/heads/beta \
            "refs/tags/${{ steps.beta_version.outputs.release_tag }}"

      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.beta_version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.capture_release_sha.outputs.release_sha }}
        run: |
          set -euo pipefail
          # The release tag was already pushed. A transient `gh release
          # create` failure here must not permanently burn this version
          # number, so retry with backoff and treat an already-existing
          # release (e.g. from a prior attempt of this same step, or a
          # workflow re-run) as success instead of erroring out.
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; reusing it."
              exit 0
            fi
            if gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "Beta $RELEASE_TAG" \
              --generate-notes \
              --draft \
              --prerelease \
              --latest=false; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to create GitHub release $RELEASE_TAG after 5 attempts."
          exit 1

  build-apps:
    name: Build app binaries
    needs: release
    uses: ./.github/workflows/_build-apps.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-package:
    name: Publish beta package
    needs: release
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout release
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Set up Node.js
        if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Flutter
        if: env.NODE_AUTH_TOKEN != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Install dependencies
        if: env.NODE_AUTH_TOKEN != ''
        run: npm ci

      - name: Install Flutter dependencies
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: flutter_app
        run: flutter pub get

      - name: Publish package
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --tag beta

  publish-app-assets:
    name: Complete GitHub prerelease
    # Only the release job (tag + draft release) is required. build-apps is
    # intentionally not checked: it fans out into independent per-platform
    # jobs, and _publish-app-assets.yml already tolerates partial platform
    # failures, only hard-failing if zero assets came through. publish-package
    # (npm) is unrelated to the GitHub release/binaries and must not be able
    # to strand a draft release with working binaries — we still wait for it
    # to finish (via `needs`) so it isn't racing the release, but an npm
    # publish failure no longer blocks flipping the draft to published.
    if: >-
      always() &&
      needs.release.result == 'success'
    needs:
      - release
      - build-apps
      - publish-package
    uses: ./.github/workflows/_publish-app-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: true

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-app-assets
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
