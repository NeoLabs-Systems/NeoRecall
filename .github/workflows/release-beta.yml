name: Release Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish beta release
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.beta_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve next beta version
        id: beta_version
        run: node scripts/next_release_version.js beta

      - name: Set package version
        run: npm version "${{ steps.beta_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Backend tests
        run: npm run test:backend

      - name: Flutter checks
        working-directory: flutter_app
        run: flutter analyze --no-pub && flutter test --no-pub

      - name: Build bundled web client
        run: npm run build:web

      - name: Commit and tag beta release
        run: |
          git add package.json package-lock.json
          git commit -m "chore(beta-release): v${{ steps.beta_version.outputs.version }} [skip ci]" || true
          git tag "${{ steps.beta_version.outputs.release_tag }}" -m "chore(beta-release): v${{ steps.beta_version.outputs.version }}"

      - name: Push beta release commit and tag
        run: |
          git push origin HEAD:beta
          git push origin "${{ steps.beta_version.outputs.release_tag }}"

      - name: Publish beta package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --tag beta

      - name: Create GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.beta_version.outputs.release_tag }}" \
            --title "Beta ${{ steps.beta_version.outputs.release_tag }}" \
            --generate-notes \
            --prerelease

      - name: Capture release sha
        id: capture_release_sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build desktop clients
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - if: matrix.platform == 'macos'
        run: flutter build macos --release --no-pub && ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/NeoRecall.app ../NeoRecall-macOS.zip
        working-directory: flutter_app
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: flutter build windows --release --no-pub; Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../NeoRecall-Windows-x64.zip
        working-directory: flutter_app
      - shell: bash
        run: gh release upload "${{ needs.release.outputs.release_tag }}" NeoRecall-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  notify-discord:
    name: Notify Discord
    needs: release
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
